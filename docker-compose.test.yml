x-base: &base
  build:
    context: .
    dockerfile: ./Dockerfile
  environment:
    - DATABASE_HOST=postgres
    - DATABASE_PORT=5432
    - DATABASE_USERNAME=postgres
    - DATABASE_PASSWORD=postgres
    - RAILS_ENV=test
    - CI=true
    - RAILS_LOG_TO_STDOUT=true
    - SELENIUM_URL=http://chrome:4444/wd/hub
    # Port of the Capybara test server, and the address Chrome reaches it at
    - CAPYBARA_SERVER_PORT=30000
    - CAPYBARA_APP_HOST=http://chickenhouse-test:30000
  depends_on:
    chrome:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Chrome needs additional capabilities in Docker

services:
  app:
    <<: *base
    ports:
      - '3000:3000'
    # Chrome must not reach the app as "app": .app is an HSTS-preloaded TLD,
    # so Chrome forces https://app and the plain-HTTP test server fails
    networks:
      default:
        aliases:
          - chickenhouse-test
    healthcheck:
      test: curl --fail http://0.0.0.0:3000/ready || exit 1
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
  chrome:
    image: selenium/standalone-chrome:4
    environment:
      # specs using using_session keep several browser sessions open at once
      SE_NODE_MAX_SESSIONS: 8
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports:
      - 4444:4444
      # for debugging open with vnc://localhost:5900 password=secret
      # but don't run chrome in headless mode
      - 5900:5900
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/wd/hub/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres:
  bundle:
  rails_cache:
  node_modules:
